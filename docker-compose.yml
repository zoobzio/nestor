services:
  # =============================================================================
  # Core Infrastructure
  # =============================================================================

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: nestor
      POSTGRES_USER: nestor
      POSTGRES_PASSWORD: nestor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nestor"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: ghcr.io/kukymbr/goose-docker:latest
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: "host=postgres port=5432 user=nestor password=nestor dbname=nestor sslmode=disable"
      GOOSE_MIGRATION_DIR: /migrations

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nestor
      MINIO_ROOT_PASSWORD: nestordev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =============================================================================
  # Observability Stack
  # =============================================================================

  # Traces - Jaeger
  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # UI

  # Logs - Loki
  loki:
    image: grafana/loki:latest
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - lokidata:/loki

  # Metrics - Prometheus
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./tools/dev/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    ports:
      - "9090:9090"

  # OTEL Collector - Central hub
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    volumes:
      - ./tools/dev/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4318:4318"    # OTLP HTTP
    depends_on:
      - jaeger
      - loki
      - prometheus

  # Grafana - Unified dashboard (optional but useful)
  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "3000:3000"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./tools/dev/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
      - jaeger

  # =============================================================================
  # Application
  # =============================================================================

  app:
    build:
      context: .
      dockerfile: tools/dev/Dockerfile.dev
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      NESTOR_PORT: "8080"
      NESTOR_DATABASE_DSN: "postgres://nestor:nestor@postgres:5432/nestor?sslmode=disable"
      NESTOR_EMBEDDING_PROVIDER: "stub"
      NESTOR_EMBEDDING_DIMENSIONS: "1536"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: nestor
    ports:
      - "8080:8080"
    volumes:
      - .:/app

  admin:
    build:
      context: .
      dockerfile: tools/dev/Dockerfile.dev
    command: ["air", "-c", ".air.admin.toml"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NESTOR_ADMIN_PORT: "8081"
      NESTOR_DATABASE_DSN: "postgres://nestor:nestor@postgres:5432/nestor?sslmode=disable"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: nestor-admin
    ports:
      - "8081:8081"
    volumes:
      - .:/app

volumes:
  pgdata:
  redisdata:
  miniodata:
  lokidata:
  prometheusdata:
  grafanadata:
